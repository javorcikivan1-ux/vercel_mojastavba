<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stranka nenajdena | MojaStavba</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(92vw, 480px);
        padding: 34px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: white;
        box-shadow: 0 20px 55px rgba(15, 23, 42, .08);
        text-align: center;
      }
      img {
        width: 58px;
        height: 58px;
        object-fit: contain;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0 0 24px;
        color: #475569;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 14px;
        background: #ea580c;
        color: white;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="MojaStavba">
      <h1>Stranka neexistuje</h1>
      <p>Adresa, ktoru hladate, nie je dostupna. Vratte sa prosim na uvod aplikacie.</p>
      <a href="/">Spat na MojaStavba</a>
    </main>
  </body>
</html>
