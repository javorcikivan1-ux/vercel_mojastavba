    <style>
      .boot-splash {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .boot-card { width: 100%; max-width: 360px; }
      .boot-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 24px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
        border: 1px solid #e2e8f0;
      }
      .boot-logo img { width: 48px; height: 48px; object-fit: contain; }
      .boot-title {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        font-weight: 750;
      }
      .boot-spinner {
        width: 20px;
        height: 20px;
        border: 3px solid #fed7aa;
        border-top-color: #ea580c;
        border-radius: 999px;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-text {
        margin: 12px auto 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
